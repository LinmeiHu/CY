[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "five-strategy-bundle"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "numpy>=1.24", "pandas>=2.0", "pyarrow>=14"]

[project.scripts]
five-strategy-reproduce = "five_strategy_bundle.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/shared_capital_v1/tests", "research/capital_scaling_v1/tests"]
pythonpath = ["src", "."]
